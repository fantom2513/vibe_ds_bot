# Конфиг actionlint. Нужен потому, что джоба hermeticity линтует все
# workflow разом, а deploy.yaml ходит на self-hosted раннер с кастомной
# меткой — про неё actionlint знать неоткуда, и он справедливо ругается
# на «неизвестный label».
#
# Объявляем метку явно, а не глушим правило: правило runner-label ловит
# настоящие опечатки в runs-on, из-за которых джоба молча висит в очереди
# вечно, не находя раннера. Терять такую проверку ради одной известной
# метки не стоит.
self-hosted-runner:
  labels:
    - lastelle
