server {
    listen 80;
    server_name _;

    # The public landing occupies the root URL. Its <base href="/landing/">
    # keeps its fonts, scripts and image scoped away from the Vite bundle.
    location = / {
        root /usr/share/nginx/html;
        try_files /landing/index.html =404;
    }

    # The React dashboard is isolated beneath /admin.
    location = /admin {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ^~ /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /landing/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # Vite assets and non-application static files.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # SSE — отдельный location без буферизации
    location /api/dashboard/stream {
        proxy_pass http://bot-api:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # Proxy API
    location /api/ {
        proxy_pass http://bot-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Auth
    location /auth/ {
        proxy_pass http://bot-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
